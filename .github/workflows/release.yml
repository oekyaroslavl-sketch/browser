name: Release Desktop Installers

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-before-bundle:
    name: Pre-Release Solver & Legal Hygiene Gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Ensure bundle.resources is empty & no range packs tracked
        run: |
          if git ls-files | grep -Ei '(nandez_pack|\.local/|JNandez.*\.xlsx|\.plotree$)'; then
            echo "ERROR: Proprietary range pack or snapshot tracked in Git!"
            exit 1
          fi
          python3 -c '
          import json
          cfg = json.load(open("apps/plo_desktop/src-tauri/tauri.conf.json"))
          assert cfg.get("bundle", {}).get("resources") == [], "bundle.resources must remain []"
          '

      - name: Lint & run headless desktop verification (t1..t18)
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo check -p plo_wasm --target wasm32-unknown-unknown
          cargo test -p plo_desktop_commands --release

  build-tauri-installers:
    name: Build Tauri 2 Native Bundle (${{ matrix.label }})
    needs: verify-before-bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: Windows-x64-MSI-NSIS
            args: ""
          - platform: macos-latest
            label: macOS-Universal-DMG
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            label: Linux-x64-AppImage-Deb
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux WebKit2GTK & AppImage dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/plo_desktop/src-tauri -> target"

      - name: Build Tauri 2 Desktop Installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/plo_desktop/src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "PLO-4 Postflop — Hero vs Range ${{ github.ref_name }}"
          releaseBody: |
            Native cross-platform installers for **PLO-4 Postflop — Hero vs Range** (Tauri 2 + Rust DCFR).
            - **Windows**: `.msi` & `-setup.exe` (WebView2)
            - **macOS**: `.dmg` Universal (`Apple Silicon + Intel`)
            - **Linux**: `.AppImage` & `.deb`
            > **Note**: Purchased preflop range packs (e.g. `JNandez Preflop Chart.xlsx`) are **not** bundled; point **⚙ Pack & Settings** to your local folder after launch.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload installer artifacts to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: plo-desktop-${{ matrix.label }}
          path: |
            apps/plo_desktop/src-tauri/target/**/release/bundle/msi/*.msi
            apps/plo_desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/plo_desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/plo_desktop/src-tauri/target/**/release/bundle/deb/*.deb
            apps/plo_desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
