<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Новая вкладка · DiFri Privacy</title>
  <meta name="theme-color" content="#1a1a1a" />
  <link rel="shortcut icon" href="/svg/shield.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg: #141414;
      --panel: #1d1d1d;
      --text: #e8e8e8;
      --muted: #a0a0a0;
      --accent: #bd93f9;
      --danger: #ff5555;
      --ok: #50fa7b;
      --border: #333333;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px;
    }
    header {
      width: 100%;
      max-width: 720px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }
    .brand {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      background: var(--panel);
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .brand svg { width: 22px; height: 22px; filter: drop-shadow(0 0 6px rgba(189,147,249,0.35)); }
    h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    h1 .accent { color: var(--accent); }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 720px;
      padding: 26px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    }
    .search {
      position: relative;
      width: 100%;
    }
    input#query {
      width: 100%;
      padding: 14px 18px 14px 48px;
      font-size: 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #161616;
      color: var(--text);
      outline: none;
    }
    input#query::placeholder { color: #777; }
    input#query:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(189,147,249,0.15); }
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px; height: 20px;
      opacity: 0.55;
    }
    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 2px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: #161616;
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      user-select: none;
    }
    .chip:hover { border-color: var(--accent); }
    .chip svg { width: 14px; height: 14px; flex-shrink: 0; }
    .chip.active {
      border-color: var(--ok);
      background: rgba(80,250,123,0.12);
      color: var(--ok);
    }
    .chip.blocked { border-color: var(--danger); color: var(--danger); }
    .chip.blocked svg { fill: var(--danger); stroke: var(--danger); }
    .chip.active svg { fill: var(--ok); stroke: var(--ok); }
    .status {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }
    .status b { color: var(--text); }
    .shortcuts {
      margin-top: 22px;
      width: 100%;
      max-width: 720px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 14px;
    }
    .sc-title {
      grid-column: 1 / -1;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .btn {
      all: unset;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 14px 8px;
      border-radius: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn:hover { background: #282828; border-color: #444; color: var(--text); }
    .btn svg { width: 30px; height: 30px; fill: var(--muted); stroke: var(--muted); }
    .btn:hover svg { fill: var(--accent); stroke: var(--accent); }
    @media (max-width: 480px) {
      body { padding: 24px 12px; }
      .card { padding: 20px 16px; }
      .shortcuts { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 10px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L4 5.4V11.2C4 16.55 7.41 21.54 12 22.8C16.59 21.54 20 16.55 20 11.2V5.4L12 2Z" stroke="#bd93f9" stroke-width="2" stroke-linejoin="round" fill="rgba(189,147,249,0.16)"/>
        <path d="M9 12.2L11.1 14.3L15.4 10" stroke="#50fa7b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>DiFri <span class="accent">Privacy</span></h1>
  </header>

  <div class="card">
    <div class="search">
      <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="query" placeholder="Введите адрес или поисковый запрос…" autocomplete="off" />
    </div>
    <div class="filters" id="filters"></div>
    <div class="status" id="status"></div>
  </div>

  <div class="shortcuts">
    <div class="sc-title">Быстрый доступ</div>
    <button class="btn" onclick="navigate('https://start.duckduckgo.com')">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.78L3 8l1.33 1.33A9 9 0 1 0 13 5.74L8 10.74l6.52 6.52a9.75 9.75 0 0 0 2.78-6.74z"/><circle cx="12" cy="12" r="3"/></svg>
      DuckDuckGo
    </button>
    <button class="btn" onclick="navigate('https://brave.com/search')">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L4 5.4V11.2C4 16.55 7.41 21.54 12 22.8C16.59 21.54 20 16.55 20 11.2V5.4L12 2Z"/><path d="M9 12.2L11.1 14.3L15.4 10"/></svg>
      Brave Search
    </button>
    <button class="btn" onclick="navigate('https://github.com')">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222 0 1.602-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 21.795 24 17.3 24 12.373C24 5.373 18.626 0 12 0"/></svg>
      GitHub
    </button>
    <button class="btn" onclick="navigate('https://wikipedia.org')">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l4 4v6h-8V6l4-4zm0 18l-4-4V10h8v6l-4 4z"/></svg>
      Wikipedia
    </button>
  </div>

  <script type="module">
    import rules from "/filter-rules.json?raw" assert { type: "json" };

    const queryEl = document.getElementById("query");
    const filtersEl = document.getElementById("filters");
    const statusEl = document.getElementById("status");
    let shieldEnabled = true;
    let trackerBlockCount = 0;

    const chips = [
      { id: "shield", label: "Щит приватности", icon: "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 2L4 5.4V11.2C4 16.55 7.41 21.54 12 22.8C16.59 21.54 20 16.55 20 11.2V5.4L12 2Z'/><path d='M9 12.2L11.1 14.3L15.4 10'/></svg>", kind: "shield" },
      { id: "burn", label: "Сжечь сессию", icon: "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 22C16.4183 22 19.5 18.866 19.5 14.5C19.5 10.2 16.4 6.1 12.6 2.5C10.1 5.3 8.8 7.8 8.7 10.2C7.4 9.4 6.9 8 6.9 8C5.3 9.9 4.5 12.1 4.5 14.5C4.5 18.866 7.58172 22 12 22Z'/><path d='M12.5 2C12.5 2 16.5 5.6 16.5 9.8C16.5 11.1 15.9 12.2 15 12.9C15.4 11.7 15.1 10.3 14.2 9.4C14.2 9.4 14.3 12.2 12.2 13.5C10.9 14.3 10.2 15.6 10.5 17.1C8.3 16.3 7 14.1 7 11.7C7 8.4 9.5 5.4 12.5 2Z'/></svg>", kind: "blocked" },
      { id: "stats", label: "Блокировано: 0", icon: "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='11' width='18' height='11' rx='2' ry='2'/><path d='M7 11V7a5 5 0 0 1 10 0v4'/></svg>", kind: "muted" }
    ];

    function renderChips() {
      filtersEl.innerHTML = chips.map(c => `
        <button class="chip ${c.kind === 'shield' ? 'active' : shieldEnabled ? 'active' : ''} ${c.kind === 'blocked' ? 'blocked' : ''}" id="chip-${c.id}" title="${c.label}">
          <span>${c.icon}</span><span>${c.label}${c.id === 'stats' ? ': <b id="stat-num">0</b>' : ''}</span>
        </button>
      `).join('');
      document.getElementById("chip-shield")?.addEventListener("click", () => {
        shieldEnabled = !shieldEnabled;
        document.getElementById("chip-shield").classList.toggle("active", shieldEnabled);
        statusEl.textContent = shieldEnabled ? "Щит приватности включён" : "Щит отключён — трекеры не блокируются";
        statusEl.style.color = shieldEnabled ? "var(--text)" : "var(--muted)";
      });
      document.getElementById("chip-burn")?.addEventListener("click", async () => {
        if (!confirm("Сжечь сессию? Удалит куки, локальное хранилище, кэш и историю текущей вкладки.")) return;
        const { invoke } = await import("@tauri-apps/api/core");
        try {
          await invoke("clear_browsing_data");
          statusEl.textContent = "Сессия сожжена — данные очищены";
          statusEl.style.color = "var(--ok)";
          setTimeout(() => { statusEl.textContent = ""; }, 3000);
          location.reload();
        } catch (e) {
          statusEl.textContent = "Не удалось очистить данные";
          statusEl.style.color = "var(--danger)";
        }
      });
    }

    function normalize(url) {
      let u = url.trim().toLowerCase();
      if (!u.includes("://")) u = "https://" + u;
      return u;
    }

    function navigate(url) {
      window.location.href = normalize(url);
    }

    queryEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const v = queryEl.value.trim();
        if (!v) return;
        if (v.includes(".") && !v.includes(" ")) {
          navigate(v);
        } else {
          navigate("https://html.duckduckgo.com/html/?q=" + encodeURIComponent(v));
        }
      }
    });

    function updateStats(n) {
      trackerBlockCount += n;
      const el = document.getElementById("stat-num");
      if (el) el.textContent = trackerBlockCount;
      document.getElementById("chip-stats")?.setAttribute("title", `Заблокировано запросов трекеров/рекламы: ${trackerBlockCount}`);
    }

    renderChips();

    // Detect blocked navigation attempt (when WebView redirects to block page)
    const blocked = sessionStorage.getItem("difri:blocked");
    if (blocked) {
      statusEl.textContent = "Запрошенный ресурс заблокирован щитом приватности";
      statusEl.style.color = "var(--danger)";
      sessionStorage.removeItem("difri:blocked");
      document.getElementById("chip-burn")?.classList.add("blocked");
      updateStats(1);
    }

    // Expose helpers for Tauri IPC
    window.__difri = { rules, updateStats };
  </script>
</body>
</html>
