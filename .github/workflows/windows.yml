name: Build DiFri Privacy (Windows)

on:
  push:
    branches: [master]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install dependencies
        run: npm ci

      - name: Build with Tauri
        run: npm run tauri:build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect Windows installers
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle -Recurse | Where-Object { $_.Extension -in @('.msi', '.nsis', '.exe') } | ForEach-Object { Copy-Item $_.FullName -Destination ./out/ -Force }
          New-Item -ItemType Directory -Force -Path out | Out-Null

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: difri-privacy-windows
          path: out/*.{msi,nsis,exe}
          retention-days: 14
