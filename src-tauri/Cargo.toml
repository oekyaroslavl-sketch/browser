[package]
name = "difri-privacy"
version = "2.1.0"
edition = "2021"
description = "DiFri Privacy — Lightweight cross-platform private browser"
authors = ["DiFri Privacy project"]
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []

[dependencies]
tauri = { version = "2.12", features = ["unstable"] }
tauri-plugin-dialog = { version = "2" }
tauri-plugin-fs = { version = "2" }
tauri-plugin-shell = { version = "2" }
tauri-plugin-updater = { version = "2", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.39", features = ["full"] }
dirs = "5.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = "thin"
codegen-units = 16
panic = "abort"

[profile.dev]
opt-level = 1

