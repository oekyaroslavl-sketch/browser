name: Build DiFri Privacy (Android APK)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Add Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      # android-actions/setup-android@v3 падал на этом раннере, а SDK и NDK
      # в образе ubuntu-latest уже есть — используем их напрямую.
      - name: Locate Android SDK and NDK
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [ -d "$SDK/ndk" ]; then
            NDK=$(ls -d "$SDK"/ndk/* | sort -V | tail -n 1)
            echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          fi
          echo "sdk: $SDK"
          echo "ndk: ${NDK:-not bundled, will install}"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version || true

      - name: Ensure NDK is installed
        run: |
          set -e
          SDK="$ANDROID_HOME"
          if [ -z "$NDK_HOME" ] || [ ! -d "$NDK_HOME" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973"
            echo "NDK_HOME=$SDK/ndk/27.0.12077973" >> "$GITHUB_ENV"
          fi

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Build frontend
        run: npx vite build

      - name: Init Tauri Android project
        run: npx tauri android init --ci
        env:
          TAURI_ANDROID_MIN_SDK_VERSION: "24"

      # Debug-APK подписывается автоматически debug-ключом и ставится на
      # устройство без keystore. Для release-сборки нужны secrets с ключом.
      - name: Build Android APK
        run: npx tauri android build --apk --debug --ci

      - name: Locate and copy APK
        run: |
          set -e
          mkdir -p out
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then echo "::error::APK not found"; find src-tauri/gen/android -name '*.apk' || true; exit 1; fi
          cp "$APK" out/difri-privacy-debug.apk
          echo "APK: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: difri-privacy-android-apk
          path: out/difri-privacy-debug.apk
          if-no-files-found: error
          retention-days: 30
